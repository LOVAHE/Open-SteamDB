name: Collect Steam data

on:
  push:
    paths: ['.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Collection cycle
        type: choice
        options: [players, daily]
        default: players
      price_batch:
        description: Price market batch (timed trigger selects one)
        type: choice
        options: [all, '0', '1', '2', none]
        default: all
      history_appids:
        description: Prioritize price history for these AppIDs (comma-separated)
        type: string
        default: ''
      bootstrap_history:
        description: Fill missing recent player history
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
concurrency:
  group: steam-data
  cancel-in-progress: false
  queue: max
jobs:
  batch_a:
    name: Live data / price batch A
    if: ${{ (github.event_name == 'push' || inputs.price_batch == 'all') || inputs.mode == 'players' || inputs.price_batch == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_b: ${{ steps.collect.outputs.run_b }}
      run_c: ${{ steps.collect.outputs.run_c }}
    steps:
      - name: Record job deadline
        id: job_budget
        run: |
          echo "deadline_ms=$(( $(date +%s%3N) + 570000 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          clean: false
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/cache@v6
        id: collector-deps
        with:
          path: .github/collector-deps/node_modules
          key: steam-collector-${{ runner.os }}-node24-${{ hashFiles('.github/collector-deps/package-lock.json') }}
      - name: Prepare pinned collector runtime
        if: steps.collector-deps.outputs.cache-hit != 'true'
        run: npm ci --prefix .github/collector-deps --ignore-scripts --no-audit --no-fund
      - name: Collect and save data
        id: collect
        env:
          COLLECTION_DEADLINE_MS: ${{ steps.job_budget.outputs.deadline_ms }}
          JOB_PRICE_BATCH: '0'
          PRICE_BATCH: ${{ inputs.price_batch || (github.event_name == 'push' && 'all' || 'none') }}
          CATALOG_URL: ${{ secrets.CATALOG_URL }}
          COLLECTION_BOOTSTRAP: ${{ github.event_name == 'push' && '1' || '0' }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          BOOTSTRAP_PLAYER_HISTORY: ${{ inputs.bootstrap_history == true && '1' || '0' }}
          HISTORY_APPIDS: ${{ inputs.history_appids || '' }}
          COLLECTION_MODE: ${{ inputs.mode || (github.event_name == 'push' && 'daily' || 'players') }}
        run: |
          collector_timeout_command="$(command -v gnutimeout || command -v timeout || true)"
          if [ -z "$collector_timeout_command" ]; then
            echo 'GNU timeout is required.' >&2
            exit 1
          fi
          case "$("$collector_timeout_command" --version)" in
            *'(GNU coreutils)'*) ;;
            *) echo 'GNU timeout is required.' >&2; exit 1 ;;
          esac
          if [[ ! "$COLLECTION_DEADLINE_MS" =~ ^[1-9][0-9]{12}$ ]]; then
            echo '{"event":"action_error","stage":"configuration","reason":"invalid_job_deadline"}' >&2
            exit 1
          fi
          collector_remaining_ms=$(( COLLECTION_DEADLINE_MS - $(date +%s%3N) ))
          if (( collector_remaining_ms <= 0 )); then
            echo '{"event":"action_error","stage":"configuration","reason":"job_budget_exhausted"}' >&2
            exit 1
          fi
          if (( collector_remaining_ms > 570000 )); then collector_remaining_ms=570000; fi
          collector_timeout_seconds="$((collector_remaining_ms / 1000)).$(printf '%03d' $((collector_remaining_ms % 1000)))"
          "$collector_timeout_command" --signal=TERM --kill-after=1s "${collector_timeout_seconds}s" node --input-type=module <<'STEAM_DATA_RUN'
          import { brotliDecompressSync } from 'node:zlib';
          // data-repo/scripts/action-log.mjs
          import { writeSync } from "node:fs";
          var WAIT_SLOT = new Int32Array(new SharedArrayBuffer(4));
          var waitSync = (milliseconds) => Atomics.wait(WAIT_SLOT, 0, 0, milliseconds);
          function writeActionDiagnostic(value, { write = writeSync, clock = () => performance.now(), wait = waitSync, maxWaitMs = 1e3 } = {}) {
            let bytes;
            try {
              bytes = Buffer.from(JSON.stringify(value) + "\n");
            } catch {
              return false;
            }
            if (bytes.length > 4096 || !Number.isFinite(maxWaitMs) || maxWaitMs < 0 || maxWaitMs > 1e3) return false;
            const started = clock();
            if (!Number.isFinite(started)) return false;
            let offset = 0;
            while (offset < bytes.length) {
              try {
                const count = write(2, bytes, offset, bytes.length - offset);
                if (!Number.isInteger(count) || count < 0 || count > bytes.length - offset) return false;
                offset += count;
                if (offset === bytes.length) return true;
              } catch (error) {
                if (!["EAGAIN", "EINTR"].includes(error?.code)) return false;
              }
              const remaining = maxWaitMs - (clock() - started);
              if (!Number.isFinite(remaining) || remaining <= 0) return false;
              wait(Math.min(10, remaining));
            }
            return true;
          }
          const failed = (stage,reason) => { writeActionDiagnostic({event:'action_error',stage,reason});process.exitCode=1; };
          process.on('uncaughtException',()=>{failed('runtime','uncaught_exception');process.exit(1);});
          process.on('unhandledRejection',()=>{failed('runtime','unhandled_rejection');process.exit(1);});
          let stage='decompress';
          try {
            const source=brotliDecompressSync(Buffer.from('', 'base64'));
            stage='module_load';
            await import('data:text/javascript;base64,'+source.toString('base64'));
          } catch { failed(stage,'collector_module_failed');process.exit(1); }
          STEAM_DATA_RUN
  batch_b:
    name: Price batch B
    needs: batch_a
    if: ${{ !cancelled() && (needs.batch_a.result == 'success' || needs.batch_a.result == 'skipped') && (inputs.price_batch == '1' || ((github.event_name == 'push' || inputs.price_batch == 'all') && needs.batch_a.outputs.run_b == 'true')) }}
