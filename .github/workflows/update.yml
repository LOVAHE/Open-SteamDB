name: Collect Steam data

on:
  push:
    paths: ['.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Collection cycle
        type: choice
        options: [players, daily]
        default: players
      price_batch:
        description: Price market batch (timed trigger selects one)
        type: choice
        options: [all, '0', '1', '2', none]
        default: all
      bootstrap_history:
        description: Fill missing recent player history
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
concurrency:
  group: steam-data
  cancel-in-progress: false
  queue: max
jobs:
  batch_a:
    name: Live data / price batch A
    if: ${{ (github.event_name == 'push' || inputs.price_batch == 'all') || inputs.mode == 'players' || inputs.price_batch == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      run_b: ${{ steps.collect.outputs.run_b }}
      run_c: ${{ steps.collect.outputs.run_c }}
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        id: collector-deps
        with:
          path: .github/collector-deps/node_modules
          key: steam-collector-${{ runner.os }}-node24-${{ hashFiles('.github/collector-deps/package-lock.json') }}
      - name: Prepare pinned collector runtime
        if: steps.collector-deps.outputs.cache-hit != 'true'
        run: npm ci --prefix .github/collector-deps --ignore-scripts --no-audit --no-fund
      - name: Collect and save data
        id: collect
        env:
          JOB_PRICE_BATCH: '0'
          PRICE_BATCH: ${{ inputs.price_batch || (github.event_name == 'push' && 'all' || 'none') }}
          CATALOG_URL: ${{ secrets.CATALOG_URL }}
          COLLECTION_BOOTSTRAP: ${{ github.event_name == 'push' && '1' || '0' }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          BOOTSTRAP_PLAYER_HISTORY: ${{ inputs.bootstrap_history == true && '1' || '0' }}
          COLLECTION_MODE: ${{ inputs.mode || (github.event_name == 'push' && 'daily' || 'players') }}
