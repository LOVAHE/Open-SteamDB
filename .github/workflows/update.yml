            await import('data:text/javascript;base64,'+source.toString('base64'));
          } catch { failed(stage,'collector_module_failed');process.exit(1); }
          STEAM_DATA_RUN
  batch_c:
    name: Price batch C
    needs: [batch_a, batch_b]
    if: ${{ !cancelled() && (needs.batch_a.result == 'success' || needs.batch_a.result == 'skipped') && (needs.batch_b.result == 'success' || needs.batch_b.result == 'skipped') && (inputs.price_batch == '2' || ((github.event_name == 'push' || inputs.price_batch == 'all') && needs.batch_a.outputs.run_c == 'true')) }}
