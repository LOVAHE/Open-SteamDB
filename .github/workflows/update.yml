          "$collector_timeout_command" --signal=TERM --kill-after=1s "${collector_timeout_seconds}s" node --input-type=module <<'STEAM_DATA_RUN'
          import { brotliDecompressSync } from 'node:zlib';
          // data-repo/scripts/action-log.mjs
          import { writeSync } from "node:fs";
          var WAIT_SLOT = new Int32Array(new SharedArrayBuffer(4));
          var waitSync = (milliseconds) => Atomics.wait(WAIT_SLOT, 0, 0, milliseconds);
          function writeActionDiagnostic(value, { write = writeSync, clock = () => performance.now(), wait = waitSync, maxWaitMs = 1e3 } = {}) {
